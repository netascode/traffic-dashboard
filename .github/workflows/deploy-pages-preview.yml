name: Deploy Dashboard Preview

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync GitHub Traffic Dashboard"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-${{ github.event.workflow_run.head_branch || github.ref_name || 'manual' }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: >-
      ${{ (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch != 'main') ||
          github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          test -s public/dashboard.json || { echo "Missing public/dashboard.json in checked out branch"; exit 1; }
          BRANCH_SLUG="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          BRANCH_SLUG="${BRANCH_SLUG//\//-}"
          mkdir -p _site/public
          cp index.html _site/index.html
          cp public/dashboard.json _site/public/dashboard.json
          {
            echo "window.PREVIEW_BRANCH = '${BRANCH_SLUG}';"
          } > _site/preview-meta.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: true

      - name: Print preview deployment details
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "workflow_run_head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "workflow_run_head_sha=${{ github.event.workflow_run.head_sha }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "preview_url=${{ steps.deployment.outputs.page_url }}"
          echo "deployment_id=${{ steps.deployment.outputs.deployment_id }}"
