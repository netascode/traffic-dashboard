name: Deploy Dashboard Preview

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync GitHub Traffic Dashboard"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-${{ github.event.workflow_run.head_branch || github.ref_name || 'manual' }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: >-
      ${{ (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch != 'main') ||
          github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site/public
          cp index.html _site/index.html
          if [ -f public/dashboard.json ]; then cp public/dashboard.json _site/public/dashboard.json; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: true

      - name: Print preview URL
        run: |
          echo "Preview URL: ${{ steps.deployment.outputs.page_url }}"
