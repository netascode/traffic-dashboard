name: Deploy Dashboard Preview

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync GitHub Traffic Dashboard"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-preview-${{ github.event.workflow_run.head_branch || github.ref_name || 'manual' }}
  cancel-in-progress: true

env:
  PREVIEW_REPOSITORY: netascode/traffic-dashboard-preview
  PREVIEW_DEPLOY_TOKEN: ${{ secrets.PREVIEW_DEPLOY_PAT || secrets.TRAFFIC_PAT }}

jobs:
  deploy-preview:
    if: >-
      ${{ (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch != 'main') ||
          github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate preview deployment token
        run: |
          if [ -z "${PREVIEW_DEPLOY_TOKEN}" ]; then
            echo "Missing deploy token: set PREVIEW_DEPLOY_PAT (preferred) or TRAFFIC_PAT"
            exit 1
          fi

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

      - name: Prepare site artifact
        run: |
          test -s public/dashboard.json || { echo "Missing public/dashboard.json in checked out branch"; exit 1; }
          BRANCH_SLUG="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          BRANCH_SLUG="${BRANCH_SLUG//\//-}"
          mkdir -p _site/public
          cp index.html _site/index.html
          cp public/dashboard.json _site/public/dashboard.json
          {
            echo "window.PREVIEW_BRANCH = '${BRANCH_SLUG}';"
          } > _site/preview-meta.js

      - name: Deploy preview site
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ env.PREVIEW_DEPLOY_TOKEN }}
          external_repository: ${{ env.PREVIEW_REPOSITORY }}
          publish_branch: gh-pages
          publish_dir: _site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: >-
            chore: preview deploy from
            ${{ github.event.workflow_run.head_branch || github.ref_name }}
            @ ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Print dedicated preview URL
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "workflow_run_head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "workflow_run_head_sha=${{ github.event.workflow_run.head_sha }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "preview_url=https://netascode.github.io/traffic-dashboard-preview/"
