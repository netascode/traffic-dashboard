name: Deploy Dashboard to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync GitHub Traffic Dashboard"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

      - name: Prepare site artifact
        run: |
          test -s public/dashboard.json || { echo "Missing public/dashboard.json in checked out branch"; exit 1; }
          mkdir -p _site/public
          cp index.html _site/index.html
          cp public/dashboard.json _site/public/dashboard.json

      - name: Deploy production site to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          destination_dir: .
          keep_files: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: >-
            chore: deploy production site from
            ${{ github.event.workflow_run.head_branch || github.ref_name }}
            @ ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Print production URL
        run: |
          echo "production_url=https://netascode.github.io/traffic-dashboard/"