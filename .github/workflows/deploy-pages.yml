name: Deploy Dashboard to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync GitHub Traffic Dashboard"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          test -s public/dashboard.json || { echo "Missing public/dashboard.json in checked out branch"; exit 1; }
          mkdir -p _site/public
          cp index.html _site/index.html
          cp public/dashboard.json _site/public/dashboard.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print production URL
        run: |
          echo "production_url=${{ steps.deployment.outputs.page_url }}"