name: Sync GitHub Traffic Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync traffic from configured repositories
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_PAT }}
        run: |
          node scripts/sync-github-traffic.js \
            --config=repos.json \
            --historyDir=data/raw

      - name: Sync stars from configured repositories
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_PAT }}
        run: |
          node scripts/sync-github-stars.js \
            --config=repos.json \
            --historyDir=data/raw

      - name: Restore org-member classification cache
        uses: actions/cache/restore@v4
        with:
          path: data/raw/_org-members.json
          key: org-members-${{ github.run_id }}
          restore-keys: |
            org-members-

      - name: Sync issues & PRs from configured repositories
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.TRAFFIC_PAT }}
        run: |
          node scripts/sync-github-issues.js \
            --config=repos.json \
            --historyDir=data/raw

      - name: Save org-member classification cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/_org-members.json
          key: org-members-${{ github.run_id }}

      - name: Sync registry downloads for configured repositories
        continue-on-error: true
        run: |
          node scripts/sync-registry.js \
            --config=repos.json \
            --historyDir=data/raw

      - name: Build aggregated dashboard dataset
        run: |
          node scripts/build-dashboard-data.js \
            --config=repos.json \
            --historyDir=data/raw \
            --out=public/dashboard.json

      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw public/dashboard.json
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "chore: update github traffic dashboard data"
          git push